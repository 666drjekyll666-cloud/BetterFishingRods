name: Build Better Fishing Rods research probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/fishing-runtime
    paths:
      - 'research/**'
      - 'nuget.config'
      - '.github/workflows/build-research-probe.yml'

permissions:
  contents: read

concurrency:
  group: better-fishing-rods-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore research/BetterFishingRods.ResearchProbe.csproj --configfile nuget.config

      - name: Build Release probe
        run: dotnet build research/BetterFishingRods.ResearchProbe.csproj -c Release --no-restore --nologo

      - name: Stage immutable research artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          dll='research/bin/Release/BetterFishingRodsResearchProbe.dll'
          test -f "$dll"

          mkdir -p artifacts
          handoff='Better Fishing Rods Research Probe 0.1.0.dll'
          cp "$dll" "artifacts/$handoff"

          sha256=$(sha256sum "artifacts/$handoff" | awk '{print $1}')
          {
            echo 'Artifact: Better Fishing Rods Research Probe 0.1.0'
            echo "Source SHA: $GITHUB_SHA"
            echo "SHA-256: $sha256"
            echo 'Purpose: observation-only fishing runtime evidence'
            echo 'Expected runtime log: BepInEx/BetterFishingRodsResearchProbe-0.1.0.log'
          } > artifacts/BUILD_INFO.txt

          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Research probe SHA-256: $sha256"

      - name: Upload research probe
        uses: actions/upload-artifact@v4
        with:
          name: BetterFishingRods-ResearchProbe-0.1.0-${{ github.sha }}
          path: |
            artifacts/Better Fishing Rods Research Probe 0.1.0.dll
            artifacts/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
