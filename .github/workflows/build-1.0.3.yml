# Candidate build gate for Bite Countdown 1.0.3
name: Build Bite Countdown 1.0.3

on:
  push:
    branches:
      - dev/1.0.3
    paths:
      - 'src/**'
      - 'BiteCountdown.csproj'
      - 'nuget.config'
      - '.github/workflows/build-1.0.3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bite-countdown-1.0.3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clean prior outputs
        run: rm -rf bin obj

      - name: Restore
        run: dotnet restore BiteCountdown.csproj --configfile nuget.config

      - name: Build clean Release
        run: dotnet build BiteCountdown.csproj -c Release --no-restore --nologo

      - name: Verify product identity and release diagnostics policy
        shell: bash
        run: |
          set -euo pipefail
          test -f bin/ReleasePlugin/BiteCountdown.dll
          ! grep -R -n -E 'BetterFishingRods|Better Fishing Rods|nikich\.betterfishingrods|PIXEL_SNAP|ANCHOR_PROBE' src BiteCountdown.csproj README.md AGENTS.md RELEASE_NOTES.md

      - name: Stage canonical DLL
        shell: bash
        run: |
          set -euo pipefail
          dll='bin/ReleasePlugin/BiteCountdown.dll'
          mkdir -p artifacts
          cp "$dll" artifacts/BiteCountdown.dll

          sha256=$(sha256sum artifacts/BiteCountdown.dll | awk '{print $1}')
          {
            echo 'Artifact: BiteCountdown.dll'
            echo 'Product: Bite Countdown'
            echo 'Version: 1.0.3'
            echo 'Plugin GUID: nikich.bitecountdown'
            echo "Source SHA: $GITHUB_SHA"
            echo "SHA-256: $sha256"
            echo 'Target: Graveyard Keeper 1.407'
            echo 'Scope: visual countdown only; left-facing alignment and ambient-aware ring brightness'
          } > artifacts/BUILD_INFO.txt

          echo "BiteCountdown.dll SHA-256: $sha256"

      - name: Upload immutable candidate
        uses: actions/upload-artifact@v4
        with:
          name: BiteCountdown-1.0.3-${{ github.sha }}
          path: |
            artifacts/BiteCountdown.dll
            artifacts/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
