name: Build Better Fishing Rods visual prototype

on:
  workflow_dispatch:
  push:
    branches:
      - research/fishing-visual
    paths:
      - 'research/VisualPrototype.cs'
      - 'research/BetterFishingRods.VisualPrototype.csproj'
      - 'nuget.config'
      - '.github/workflows/build-visual-prototype.yml'

permissions:
  contents: read

concurrency:
  group: better-fishing-rods-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore research/BetterFishingRods.VisualPrototype.csproj --configfile nuget.config

      - name: Build Release visual prototype
        run: dotnet build research/BetterFishingRods.VisualPrototype.csproj -c Release --no-restore --nologo

      - name: Stage immutable visual artifact
        shell: bash
        run: |
          set -euo pipefail
          dll='research/bin/VisualPrototype/BetterFishingRodsVisualPrototype.dll'
          test -f "$dll"

          mkdir -p artifacts
          handoff='Better Fishing Rods Visual Prototype 0.2.3.dll'
          cp "$dll" "artifacts/$handoff"

          sha256=$(sha256sum "artifacts/$handoff" | awk '{print $1}')
          {
            echo 'Artifact: Better Fishing Rods Visual Prototype 0.2.3'
            echo "Source SHA: $GITHUB_SHA"
            echo "SHA-256: $sha256"
            echo 'Purpose: research-only full-wait countdown ring visual prototype'
            echo 'Gameplay changes: none'
          } > artifacts/BUILD_INFO.txt

          echo "Visual prototype SHA-256: $sha256"

      - name: Upload visual prototype
        uses: actions/upload-artifact@v4
        with:
          name: BetterFishingRods-VisualPrototype-0.2.3-${{ github.sha }}
          path: |
            artifacts/Better Fishing Rods Visual Prototype 0.2.3.dll
            artifacts/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
