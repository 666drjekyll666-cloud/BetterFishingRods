name: Build Bite Countdown pixel snap prototype

on:
  push:
    branches:
      - research/pixel-snap
    paths:
      - 'research/PixelSnapPrototype.cs'
      - 'research/BiteCountdown.PixelSnapPrototype.csproj'
      - 'nuget.config'
      - '.github/workflows/build-pixel-snap-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bite-countdown-pixel-snap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Clean prior outputs
        run: rm -rf research/bin research/obj artifacts
      - name: Restore
        run: dotnet restore research/BiteCountdown.PixelSnapPrototype.csproj --configfile nuget.config
      - name: Build Release pixel snap prototype
        run: dotnet build research/BiteCountdown.PixelSnapPrototype.csproj -c Release --no-restore --nologo
      - name: Stage immutable research artifact
        shell: bash
        run: |
          set -euo pipefail
          dll='research/bin/PixelSnapPrototype/BiteCountdownPixelSnapPrototype.dll'
          test -f "$dll"
          mkdir -p artifacts
          handoff='Bite Countdown Pixel Snap Prototype 0.3.1.dll'
          cp "$dll" "artifacts/$handoff"
          sha256=$(sha256sum "artifacts/$handoff" | awk '{print $1}')
          {
            echo 'Artifact: Bite Countdown Pixel Snap Prototype 0.3.1'
            echo 'Plugin GUID: nikich.bitecountdown.pixelsnapprototype'
            echo "Source SHA: $GITHUB_SHA"
            echo "SHA-256: $sha256"
            echo 'Purpose: live A/B/C test of current vs integer vs half-pixel horizontal snapping'
            echo 'Gameplay changes: none'
            echo 'Save writes: none'
          } > artifacts/BUILD_INFO.txt
          echo "Pixel snap prototype SHA-256: $sha256"
      - name: Upload pixel snap prototype
        uses: actions/upload-artifact@v4
        with:
          name: BiteCountdown-PixelSnapPrototype-0.3.1-${{ github.sha }}
          path: |
            artifacts/Bite Countdown Pixel Snap Prototype 0.3.1.dll
            artifacts/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
