name: Build Better Fishing Rods 1.0.0

on:
  push:
    branches:
      - dev/1.0.0
    paths:
      - 'src/**'
      - 'BetterFishingRods.csproj'
      - 'nuget.config'
      - '.github/workflows/build-1.0.0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: better-fishing-rods-1.0.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BetterFishingRods.csproj --configfile nuget.config

      - name: Build clean Release
        run: |
          rm -rf bin obj
          dotnet build BetterFishingRods.csproj -c Release --no-restore --nologo

      - name: Stage canonical DLL
        shell: bash
        run: |
          set -euo pipefail
          dll='bin/ReleasePlugin/BetterFishingRods.dll'
          test -f "$dll"

          mkdir -p artifacts
          cp "$dll" artifacts/BetterFishingRods.dll

          sha256=$(sha256sum artifacts/BetterFishingRods.dll | awk '{print $1}')
          {
            echo 'Artifact: BetterFishingRods.dll'
            echo 'Version: 1.0.0'
            echo "Source SHA: $GITHUB_SHA"
            echo "SHA-256: $sha256"
            echo 'Target: Graveyard Keeper 1.407'
            echo 'Scope: visual countdown only'
          } > artifacts/BUILD_INFO.txt

          echo "BetterFishingRods.dll SHA-256: $sha256"

      - name: Upload immutable candidate
        uses: actions/upload-artifact@v4
        with:
          name: BetterFishingRods-1.0.0-${{ github.sha }}
          path: |
            artifacts/BetterFishingRods.dll
            artifacts/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
